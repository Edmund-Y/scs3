<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
  <title>경로식당 이용자 관리 프로그램</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <div class="sidebar-brand">
        <h2>경로식당 관리</h2>
      </div>
      <div class="sidebar-nav">
        <button class="nav-item active" data-page="home">
          <span class="icon">🏠</span>
          <span class="label">홈</span>
        </button>
        <button class="nav-item" data-page="count">
          <span class="icon">📊</span>
          <span class="label">실시간 현황</span>
        </button>
        <button class="nav-item" data-page="edit">
          <span class="icon">👥</span>
          <span class="label">사용자 관리</span>
        </button>
        <button class="nav-item" data-page="special-remarks">
          <span class="icon">⚠️</span>
          <span class="label">특이사항</span>
        </button>
        <button class="nav-item" data-page="dashboard">
          <span class="icon">📈</span>
          <span class="label">통계</span>
        </button>
        <div class="nav-spacer"></div>
        <button class="nav-item" data-page="settings">
          <span class="icon">⚙️</span>
          <span class="label">설정</span>
        </button>
      </div>
    </nav>

    <!-- Header -->
    <header id="header">
      <span class="page-title" id="pageTitle">홈</span>
      <span class="clock" id="clock"></span>
    </header>

    <!-- Content -->
    <main id="content"></main>

    <!-- Footer -->
    <footer id="footer">
      <span>경로식당 이용자 관리 프로그램</span>
      <div class="footer-status">
        <span class="status-dot"></span>
        <span id="footerStatus">준비 완료</span>
        <button id="footerConsoleBtn" class="footer-console-btn" title="콘솔 열기/닫기">콘솔</button>
      </div>
    </footer>

    <!-- Web Console -->
    <div id="webConsole" class="web-console collapsed">
      <div class="web-console-header">
        <span class="web-console-title">콘솔</span>
        <div class="web-console-controls">
          <select id="webConsoleFilter">
            <option value="ALL">ALL</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO" selected>INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
          </select>
          <button id="webConsoleClear" title="로그 지우기">지우기</button>
          <button id="webConsoleToggle" title="닫기">✕</button>
        </div>
      </div>
      <div id="webConsoleBody" class="web-console-body"></div>
    </div>
  </div>

  <script src="js/vendor/chart.umd.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
